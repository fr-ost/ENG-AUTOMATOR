name: X daily automation

on:
  schedule:
    # 17:00 UTC = 23:00 Bangladesh time (UTC+6). GitHub may start scheduled
    # runs late (often 5-30+ minutes) under load; runs are not guaranteed exact.
    - cron: "0 17 * * *"
  workflow_dispatch:
    inputs:
      scan_since:
        description: "Recovery: rescan posts created since this UTC time (e.g. 2026-10-01T00:00:00Z). Leave empty for normal runs."
        required: false
        default: ""
      dry_run:
        description: "Dry run: scan and print the report, but save nothing and send no notification"
        type: boolean
        default: false
      allow_state_reinit:
        description: "Recovery: quarantine corrupt state files and start them fresh"
        type: boolean
        default: false

# Least privilege: nothing by default; the job below gets only what it needs.
permissions: {}

# Never run two copies at once; queue instead of cancelling a run mid-write.
concurrency:
  group: x-daily-automation
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # needed only to commit data/ and reports/
    defaults:
      run:
        working-directory: x-daily-automation

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            x-daily-automation/requirements.txt
            x-daily-automation/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests (offline, mocked APIs)
        run: python -m pytest

      - name: Run daily scan
        id: scan
        continue-on-error: true # still commit the failure report; job is failed in the last step
        env:
          # Secrets (Settings → Secrets and variables → Actions → Secrets)
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          SMM_API_KEY: ${{ secrets.SMM_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Non-secret settings (… → Actions → Variables)
          X_USERNAME: ${{ vars.X_USERNAME }}
          X_USER_ID: ${{ vars.X_USER_ID }}
          INCLUDE_QUOTE_POSTS: ${{ vars.INCLUDE_QUOTE_POSTS }}
          X_MAX_PAGES: ${{ vars.X_MAX_PAGES }}
          SCAN_OVERLAP_HOURS: ${{ vars.SCAN_OVERLAP_HOURS }}
          INITIAL_LOOKBACK_HOURS: ${{ vars.INITIAL_LOOKBACK_HOURS }}
          METRICS_LOOKBACK_DAYS: ${{ vars.METRICS_LOOKBACK_DAYS }}
          IMPRESSION_TARGET: ${{ vars.IMPRESSION_TARGET }}
          LIKE_TARGET: ${{ vars.LIKE_TARGET }}
          PROMOTION_BUDGET: ${{ vars.PROMOTION_BUDGET }}
          PROMOTION_BUDGET_CURRENCY: ${{ vars.PROMOTION_BUDGET_CURRENCY }}
          SMM_ENABLED: ${{ vars.SMM_ENABLED }}
          SMM_API_URL: ${{ vars.SMM_API_URL }}
          SMM_IMPRESSION_SERVICE_ID: ${{ vars.SMM_IMPRESSION_SERVICE_ID }}
          SMM_LIKE_SERVICE_ID: ${{ vars.SMM_LIKE_SERVICE_ID }}
          TELEGRAM_ENABLED: ${{ vars.TELEGRAM_ENABLED }}
          X_COST_PER_REQUEST_USD: ${{ vars.X_COST_PER_REQUEST_USD }}
          X_COST_PER_POST_READ_USD: ${{ vars.X_COST_PER_POST_READ_USD }}
          # Manual-run inputs (empty on scheduled runs)
          SCAN_SINCE: ${{ inputs.scan_since }}
          DRY_RUN: ${{ inputs.dry_run }}
          ALLOW_STATE_REINIT: ${{ inputs.allow_state_reinit }}
        run: python main.py

      - name: Commit state and report
        if: always() && steps.scan.outcome != 'skipped' && inputs.dry_run != true
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for dir in data reports; do
            if [ -d "$dir" ]; then git add --all -- "$dir"; fi
          done
          if git diff --cached --quiet; then
            echo "No state or report changes to commit."
            exit 0
          fi
          git commit -m "chore(bot): daily state and report $(TZ=Asia/Dhaka date +%F)"
          for attempt in 1 2 3; do
            if git push origin "HEAD:${BRANCH}"; then
              echo "Pushed bot state."
              exit 0
            fi
            echo "Push rejected (branch moved); rebasing on origin/${BRANCH} (attempt ${attempt})."
            git fetch origin "${BRANCH}"
            if ! git rebase "origin/${BRANCH}"; then
              git rebase --abort
              echo "::error::Conflict between this run's state and newer commits on ${BRANCH}. Nothing was force-pushed. The saved checkpoint is unchanged, so the next run rescans and recovers; resolve manual edits to data/ if this repeats."
              exit 1
            fi
            sleep $((attempt * 5))
          done
          echo "::error::Could not push bot state after 3 attempts."
          exit 1

      - name: Fail job if the scan failed
        if: steps.scan.outcome == 'failure'
        run: |
          echo "::error::The daily scan failed or was incomplete. See the report in x-daily-automation/reports/ and the 'Run daily scan' log."
          exit 1
