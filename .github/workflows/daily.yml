name: Daily X automation

on:
  schedule:
    - cron: "0 17 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: x-daily-automation
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r x-daily-automation/requirements.txt

      - name: Run tests
        run: pytest x-daily-automation/tests -q

      - name: Run scanner
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          X_USERNAME: ${{ secrets.X_USERNAME }}
          X_USER_ID: ${{ secrets.X_USER_ID }}
          X_INCLUDE_QUOTES: ${{ secrets.X_INCLUDE_QUOTES }}
          SMM_API_URL: ${{ secrets.SMM_API_URL }}
          SMM_API_KEY: ${{ secrets.SMM_API_KEY }}
          SMM_IMPRESSION_SERVICE_ID: ${{ secrets.SMM_IMPRESSION_SERVICE_ID }}
          SMM_LIKE_SERVICE_ID: ${{ secrets.SMM_LIKE_SERVICE_ID }}
          SMM_QUERY_SERVICES: ${{ secrets.SMM_QUERY_SERVICES }}
          SMM_STATUS_ORDER_IDS: ${{ secrets.SMM_STATUS_ORDER_IDS }}
          TELEGRAM_ENABLED: ${{ secrets.TELEGRAM_ENABLED }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DATA_DIR: x-daily-automation/data
          REPORTS_DIR: x-daily-automation/reports
        run: python x-daily-automation/main.py

      - name: Commit state and reports
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add x-daily-automation/data x-daily-automation/reports
          if git diff --cached --quiet; then
            echo "No state/report changes to commit"
            exit 0
          fi
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git commit -m "chore: update automation state and report"
          git push
